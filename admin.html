<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin — TempMail</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/ui.css"><meta name="robots" content="noindex"><style>.n{font:800 34px var(--f);letter-spacing:-.02em}.ev{font:500 12px var(--m);max-height:260px;overflow:auto}.ev div{padding:5px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:var(--mut)}.dot.y{background:var(--ok)}.dot.x{background:var(--acc)}</style></head><body><div class="wrap"><nav class="nv"><a class="lg" href="/"><svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="3" y="7" width="26" height="18" rx="2"/><path d="M3 10l13 9 13-9"/><circle cx="26" cy="8" r="4" fill="#e8431f" stroke="none"/></svg>TempMail</a><a class="l " href="/docs">API</a><a class="l " href="/blog">Artikel</a><a class="l on" href="/admin">Admin</a></nav>
<div id="lg"><h1>Dashboard admin</h1><div class="cd" style="margin-top:26px;max-width:380px"><label for="pw" style="font-weight:700">Password</label><input id="pw" type="password" autocomplete="current-password" style="margin:8px 0 12px"><button class="bt" id="go">Masuk</button><p id="er" style="color:var(--acc)"></p></div></div>
<div id="db" hidden><div class="row" style="justify-content:space-between"><h1>Ringkasan</h1><button class="bt g" id="out">Keluar</button></div>
<div class="grid" style="margin-top:26px" id="tl"></div>
<h2>Aktivitas per jenis</h2><div class="cd"><svg id="ch" width="100%" role="img" aria-label="Grafik aktivitas"></svg></div>
<h2>API key</h2><div class="cd" id="ks"></div>
<h2>Artikel</h2><div class="cd"><div id="al"></div><div class="row" style="margin-top:12px"><button class="bt g s" id="an">Artikel baru</button></div>
<div id="ed" hidden style="margin-top:14px"><input id="et" placeholder="Judul"><input id="es" placeholder="slug-url" style="margin-top:8px"><input id="ed2" placeholder="waktu baca, mis. 4 mnt baca" style="margin-top:8px"><textarea id="eb" rows="9" placeholder="Paragraf dipisah baris kosong. Awali dengan ## untuk subjudul."></textarea><div class="row" style="margin-top:10px"><button class="bt" id="sv">Simpan</button><button class="bt g" id="dl">Hapus</button></div></div>
<p style="font-size:13px">Kalau daftar kosong, halaman artikel memakai 3 artikel bawaan.</p></div>
<h2>Konfigurasi</h2><div class="cd" id="cf"></div>
<h2>Kejadian terbaru</h2><div class="cd ev" id="ev"></div></div></div><script>
const $=s=>document.querySelector(s);let AL=[],ei=-1,tk=sessionStorage.tm_adm||'',tm;
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){try{const r=await fetch('/api/admin',{headers:{Authorization:'Bearer '+tk}});if(r.status===401||r.status===503){const j=await r.json();out(j.error);return}draw(await r.json())}catch{}}
function out(m){tk='';sessionStorage.removeItem('tm_adm');clearInterval(tm);$('#db').hidden=true;$('#lg').hidden=false;$('#er').textContent=m||''}
function draw(d){$('#lg').hidden=true;$('#db').hidden=false;const c=d.counters,sum=p=>Object.entries(c).filter(([k])=>k.startsWith(p)).reduce((a,[,v])=>a+v,0);
const up=Math.round((Date.now()-d.since)/60000);
$('#tl').innerHTML=[['Permintaan inbox',sum('gm:')],['Live stream',c.stream||0],['Panggilan API v1',sum('v1:')],['Kunci dibuat',c.apikey||0],['Penyedia email',(d.upstream.ok?'OK ':'Down ')+d.upstream.ms+' ms'],['Instance aktif',up+' mnt']].map(([a,b])=>'<div class="cd"><div class="tg">'+a+'</div><div class="n">'+b+'</div></div>').join('');
const rows=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=Math.max(1,...rows.map(r=>r[1]));
const ch=$('#ch');ch.setAttribute('viewBox','0 0 600 '+Math.max(40,rows.length*30));
ch.innerHTML=rows.map((r,i)=>'<text x="0" y="'+(i*30+18)+'" font-family="JetBrains Mono" font-size="12" fill="currentColor">'+E(r[0])+'</text><rect x="130" y="'+(i*30+4)+'" width="'+Math.max(4,r[1]/mx*400)+'" height="20" fill="#e8431f"/><text x="'+(138+r[1]/mx*400)+'" y="'+(i*30+19)+'" font-family="JetBrains Mono" font-size="12" font-weight="700" fill="currentColor">'+r[1]+'</text>').join('')||'<text y="20" fill="currentColor" font-size="13">Belum ada aktivitas</text>';
AL=d.articles;const k=d.config,L=[['Penyimpanan permanen (Upstash)',d.persistent],['Captcha Turnstile',k.captcha],['Shield anti-bot',k.shield],['Blokir VPN/proxy',k.vpnBlock],['API key (API_SECRET)',k.apiKeys]];
$('#cf').innerHTML=L.map(([a,b])=>'<div><span class="dot '+(b?'y':'x')+'"></span>'+a+' — '+(b?'aktif':'mati')+'</div>').join('')+(d.persistent?'':'<p style="font-size:13px">Tanpa Upstash, angka, kunci, dan artikel hanya di memori dan hilang saat instance dingin.</p>');
$('#ks').innerHTML=d.keys.length?'<table>'+d.keys.map(x=>{const rv=d.revoked.includes(x.i);return '<tr><td><code>'+E(x.i)+'</code></td><td>'+E(x.n)+'</td><td>'+new Date(x.t).toLocaleDateString('id-ID')+'</td><td>'+(rv?'dicabut':'<button class="bt s" data-rv="'+E(x.i)+'">Cabut</button>')+'</td></tr>'}).join('')+'</table>':'Belum ada kunci tercatat.';
$('#al').innerHTML=AL.map((x,i)=>'<div class="row" style="padding:6px 0"><b style="flex:1">'+E(x.t)+'</b><button class="bt g s" data-ed="'+i+'">Edit</button></div>').join('')||'Belum ada artikel kustom.';
$('#ev').innerHTML=d.events.map(e=>'<div>'+new Date(e.t).toLocaleTimeString('id-ID')+' · '+E(e.k)+' '+E(e.m)+'</div>').join('')||'Belum ada.'}
$('#go').onclick=async()=>{$('#er').textContent='';try{const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});const j=await r.json();if(!r.ok)return $('#er').textContent=j.error;tk=j.token;sessionStorage.tm_adm=tk;$('#pw').value='';load();tm=setInterval(load,5000)}catch{$('#er').textContent='Gagal terhubung'}};
const post=(r,b)=>fetch('/api/admin?r='+r,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk},body:JSON.stringify(b)}).then(x=>x.json());
document.addEventListener('click',async e=>{const t=e.target;
if(t.dataset.rv){await post('revoke',{i:t.dataset.rv});load()}
if(t.dataset.ed){ei=+t.dataset.ed;const a=AL[ei];$('#ed').hidden=false;$('#et').value=a.t;$('#es').value=a.s;$('#ed2').value=a.d;$('#eb').value=a.b}});
$('#an').onclick=()=>{ei=-1;$('#ed').hidden=false;['#et','#es','#ed2','#eb'].forEach(i=>$(i).value='')};
$('#sv').onclick=async()=>{const a={t:$('#et').value,s:$('#es').value||$('#et').value,d:$('#ed2').value,b:$('#eb').value},l=AL.slice();if(ei<0)l.unshift(a);else l[ei]=a;await post('articles',{list:l});$('#ed').hidden=true;load()};
$('#dl').onclick=async()=>{if(ei>=0){const l=AL.slice();l.splice(ei,1);await post('articles',{list:l})}$('#ed').hidden=true;load()};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};$('#out').onclick=()=>out('');
if(tk){load();tm=setInterval(load,5000)}
</script></body></html>
