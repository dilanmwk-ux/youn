<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Login — TempMail</title><script src="/theme.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><meta name="robots" content="noindex"><link rel="stylesheet" href="/site.css"></head><body><div class="wrap"><header class="sh"><a class="lg" href="/"><svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="26" height="18" rx="2"/><path d="M3 10l13 9 13-9"/><circle cx="26" cy="8" r="4" style="fill:var(--c-acc)" stroke="none"/></svg>TempMail</a><nav class="nvl" aria-label="Menu utama"><a href="/">Beranda</a><a href="/docs">API</a></nav><div class="sh-act"><button type="button" class="icon-btn" data-theme-toggle aria-label="Ganti tema"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="18" height="18" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg></button><a class="icon-btn" href="/#pengaturan" aria-label="Pengaturan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a></div></header>
<main><div id="lg"><div class="tg">Area pengelola</div><h1>Login</h1><div class="cd login stack"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><button class="bt" id="go">Masuk</button><p id="er" class="err" role="alert"></p></div></div>
<div id="db" hidden><div class="row sb"><h1>Ringkasan</h1><button class="bt g" id="out">Keluar</button></div>
<div class="grid mt" id="tl"></div>
<h2>Aktivitas per jenis</h2><div class="cd"><svg id="ch" width="100%" role="img" aria-label="Grafik aktivitas"></svg></div>
<h2>API key</h2><div class="cd" id="ks"></div>
<h2>Konfigurasi</h2><div class="cd" id="cf"></div>
<h2>Kejadian terbaru</h2><div class="cd ev" id="ev"></div></div></main></div><script>
const $=s=>document.querySelector(s);let tk=sessionStorage.tm_adm||'',tm;
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){try{const r=await fetch('/api/admin',{headers:{Authorization:'Bearer '+tk}});if(r.status===401||r.status===503){const j=await r.json();out(j.error);return}draw(await r.json())}catch{}}
function out(m){tk='';sessionStorage.removeItem('tm_adm');clearInterval(tm);$('#db').hidden=true;$('#lg').hidden=false;$('#er').textContent=m||''}
function draw(d){$('#lg').hidden=true;$('#db').hidden=false;const c=d.counters,sum=p=>Object.entries(c).filter(([k])=>k.startsWith(p)).reduce((a,[,v])=>a+v,0);
const up=Math.round((Date.now()-d.since)/60000);
$('#tl').innerHTML=[['Permintaan inbox',sum('gm:')],['Live stream',c.stream||0],['Panggilan API v1',sum('v1:')],['Kunci dibuat',Math.max(c.apikey||0,d.keys.length)],['Penyedia email',(d.upstream.ok?'OK ':'Down ')+d.upstream.ms+' ms'],['Instance aktif',up+' mnt']].map(([a,b])=>'<div class="cd"><div class="tg">'+a+'</div><div class="n">'+b+'</div></div>').join('');
const rows=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=Math.max(1,...rows.map(r=>r[1]));
const ch=$('#ch');ch.setAttribute('viewBox','0 0 600 '+Math.max(40,rows.length*30));
ch.innerHTML=rows.map((r,i)=>'<text x="0" y="'+(i*30+18)+'" font-family="JetBrains Mono" font-size="12" fill="currentColor">'+E(r[0])+'</text><rect x="130" y="'+(i*30+4)+'" width="'+Math.max(4,r[1]/mx*400)+'" height="20" style="fill:var(--c-acc)"/><text x="'+(138+r[1]/mx*400)+'" y="'+(i*30+19)+'" font-family="JetBrains Mono" font-size="12" font-weight="700" fill="currentColor">'+r[1]+'</text>').join('')||'<text y="20" fill="currentColor" font-size="13">Belum ada aktivitas</text>';
const k=d.config,L=[['Penyimpanan permanen (Upstash)',d.persistent],['Captcha Turnstile',k.captcha],['Shield anti-bot',k.shield],['Blokir VPN/proxy',k.vpnBlock],['API key (API_SECRET)',k.apiKeys]];
$('#cf').innerHTML=L.map(([a,b])=>'<div><span class="dot '+(b?'y':'x')+'"></span>'+a+' — '+(b?'aktif':'mati')+'</div>').join('')+(d.kv&&d.kv.ok?'<p class="sm">Redis terhubung. Kunci &amp; angka tersimpan permanen.</p>':'<p class="sm err">Redis TIDAK tersambung: '+E((d.kv&&d.kv.err)||'env belum diisi')+'. Selama ini merah, kunci &amp; angka tidak akan tercatat.</p>');
$('#ks').innerHTML=d.keys.length?'<div class="tw"><table>'+d.keys.map(x=>{const rv=d.revoked.includes(x.i);return '<tr><td><code>'+E(x.i)+'</code></td><td>'+E(x.n)+'</td><td>'+new Date(x.t).toLocaleDateString('id-ID')+'</td><td>'+(rv?'dicabut':'<button class="bt s" data-rv="'+E(x.i)+'">Cabut</button>')+'</td></tr>'}).join('')+'</table></div>':'Belum ada kunci tercatat.';
$('#ev').innerHTML=d.events.map(e=>'<div>'+new Date(e.t).toLocaleTimeString('id-ID')+' · '+E(e.k)+' '+E(e.m)+'</div>').join('')||'Belum ada.'}
$('#go').onclick=async()=>{$('#er').textContent='';try{const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});const j=await r.json();if(!r.ok)return $('#er').textContent=j.error;tk=j.token;sessionStorage.tm_adm=tk;$('#pw').value='';load();tm=setInterval(load,5000)}catch{$('#er').textContent='Gagal terhubung'}};
const post=(r,b)=>fetch('/api/admin?r='+r,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk},body:JSON.stringify(b)}).then(x=>x.json());
document.addEventListener('click',async e=>{const t=e.target;if(t.dataset.rv){await post('revoke',{i:t.dataset.rv});load()}});
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};$('#out').onclick=()=>out('');
if(tk){load();tm=setInterval(load,5000)}
</script></body></html>
