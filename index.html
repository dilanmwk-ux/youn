<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <meta name="description" content="TempMail — email sementara cepat & privat" />
  <title>TempMail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <div class="shell">
    <header class="top">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect x="2" y="6" width="28" height="20" rx="3" stroke="currentColor" stroke-width="2"/>
          <path d="M2 10l14 9 14-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">TempMail</span>
      </div>
      <button type="button" class="icon-btn" id="btnTheme" aria-label="Ganti tema">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="18" height="18">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="18" height="18">
          <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/>
        </svg>
      </button>
    </header>

    <section class="panel email-panel">
      <div class="panel-label">
        <span class="live-dot"></span>
        Alamat aktif
      </div>

      <div class="address-box" id="emailBox">
        <code id="emailAddress">Menyiapkan…</code>
      </div>

      <div class="action-row">
        <button type="button" class="act" id="btnCopy" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="16" height="16">
            <rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/>
          </svg>
          Salin
        </button>
        <button type="button" class="act" id="btnRefresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="16" height="16">
            <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
          </svg>
          Cek
        </button>
        <button type="button" class="act act-warn" id="btnNew">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="16" height="16">
            <path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v5h5"/>
          </svg>
          Baru
        </button>
      </div>

      <div class="custom-row">
        <div class="field">
          <input type="text" id="customUser" placeholder="username" maxlength="20" autocomplete="off" spellcheck="false" />
          <span class="field-suffix" id="domainHint">@…</span>
        </div>
        <button type="button" class="btn-solid" id="btnCustom">Pakai</button>
      </div>
    </section>

    <section class="panel inbox-panel">
      <div class="inbox-head">
        <h2>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="16" height="16">
            <path d="M4 6h16v12H4z"/><path d="M4 8l8 5 8-5"/>
          </svg>
          Inbox
          <span class="count" id="msgCount">0</span>
        </h2>
        <label class="toggle">
          <input type="checkbox" id="autoRefresh" checked />
          <span class="toggle-ui"></span>
          <span class="toggle-txt">Auto</span>
        </label>
      </div>

      <div class="inbox-body" id="inboxList">
        <div class="empty" id="emptyState">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40">
            <rect x="6" y="12" width="36" height="26" rx="3"/>
            <path d="M6 16l18 12 18-12"/>
          </svg>
          <p>Belum ada pesan</p>
          <span>Kirim email ke alamat di atas, lalu tunggu sebentar</span>
        </div>
      </div>
    </section>

    <footer class="foot">
      <p>Email sementara · pesan disimpan singkat · jangan untuk data penting</p>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-bar">
        <button type="button" class="icon-btn" id="btnCloseSheet" aria-label="Tutup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="18" height="18">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>
      <div class="sheet-meta">
        <div class="sheet-from" id="sheetFrom"></div>
        <h3 class="sheet-subject" id="sheetSubject"></h3>
        <time class="sheet-date" id="sheetDate"></time>
      </div>
      <div class="sheet-content" id="sheetBody"></div>
      <div class="sheet-foot">
        <button type="button" class="btn-ghost danger" id="btnDeleteMsg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="15" height="15">
            <path d="M4 7h16M9 7V5h6v2M8 7v12a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V7"/>
          </svg>
          Hapus
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="./app.js"></script>
</body>
</html>
