<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <meta name="description" content="TempMail — email sementara cepat & privat" />
  <title>TempMail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #09090b;
  --surface: #121214;
  --surface-2: #1a1a1e;
  --border: #27272a;
  --border-soft: #1f1f23;
  --text: #fafafa;
  --text-2: #a1a1aa;
  --text-3: #71717a;
  --accent: #e4e4e7;
  --accent-dim: #3f3f46;
  --ok: #4ade80;
  --warn: #f87171;
  --radius: 12px;
  --font: "DM Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --ease: 0.18s ease;
  --shadow: none;
}

[data-theme="light"] {
  --bg: #f0f2f5;
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --border: #e2e5eb;
  --border-soft: #eef0f4;
  --text: #111827;
  --text-2: #4b5563;
  --text-3: #9ca3af;
  --accent: #2563eb;
  --accent-dim: #dbeafe;
  --ok: #059669;
  --warn: #dc2626;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px rgba(15, 23, 42, 0.06);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  line-height: 1.5;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

.noise {
  pointer-events: none;
  position: fixed;
  inset: 0;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  z-index: 0;
}

.shell {
  position: relative;
  z-index: 1;
  max-width: 440px;
  margin: 0 auto;
  padding: 20px 16px 32px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 100dvh;
}

/* Top */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 0 6px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  width: 28px;
  height: 28px;
  color: var(--text);
}

.brand-name {
  font-weight: 650;
  font-size: 1.05rem;
  letter-spacing: -0.03em;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: background var(--ease), color var(--ease);
}

.icon-btn:hover { background: var(--surface-2); color: var(--text); }

.i-moon { display: none; }
[data-theme="light"] .i-sun { display: none; }
[data-theme="light"] .i-moon { display: block; }

/* Panels */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}

.panel-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
  margin-bottom: 12px;
}

.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent);
}

.address-box {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 14px 12px;
  text-align: center;
  margin-bottom: 12px;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.address-box code {
  font-family: var(--mono);
  font-size: 0.92rem;
  font-weight: 500;
  word-break: break-all;
  color: var(--text);
}

.address-box.ready {
  border-color: var(--accent-dim);
}

.action-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.act {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 11px 6px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-2);
  font-family: var(--font);
  font-size: 0.72rem;
  font-weight: 550;
  cursor: pointer;
  transition: background var(--ease), color var(--ease), border-color var(--ease);
}

.act:hover:not(:disabled) {
  background: var(--bg);
  color: var(--text);
  border-color: var(--text-3);
}

.act:disabled { opacity: 0.4; cursor: not-allowed; }

.act.act-warn:hover:not(:disabled) {
  color: var(--warn);
  border-color: color-mix(in srgb, var(--warn) 40%, transparent);
}

.act.copied {
  color: var(--ok) !important;
  border-color: color-mix(in srgb, var(--ok) 45%, transparent) !important;
}

.act.spinning svg { animation: spin 0.7s linear infinite; }

@keyframes spin { to { transform: rotate(360deg); } }

.custom-row {
  display: flex;
  gap: 8px;
}

.field {
  flex: 1;
  display: flex;
  align-items: center;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 9px;
  overflow: hidden;
  transition: border-color var(--ease);
}

.field:focus-within {
  border-color: var(--text-3);
}

.field input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  padding: 11px 12px;
  font-family: var(--mono);
  font-size: 0.85rem;
  color: var(--text);
  outline: none;
}

.field input::placeholder {
  color: var(--text-3);
  font-family: var(--font);
}

.field-suffix {
  padding-right: 12px;
  font-family: var(--mono);
  font-size: 0.78rem;
  color: var(--text-3);
  white-space: nowrap;
  max-width: 110px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.btn-solid {
  border: 0;
  border-radius: 9px;
  padding: 0 16px;
  background: var(--accent);
  color: var(--bg);
  font-family: var(--font);
  font-weight: 650;
  font-size: 0.85rem;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity var(--ease);
}

.btn-solid:hover { opacity: 0.88; }
.btn-solid:disabled { opacity: 0.5; cursor: not-allowed; }

/* Inbox */
.inbox-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
  min-height: 260px;
}

.inbox-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}

.inbox-head h2 {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 0.9rem;
  font-weight: 600;
}

.inbox-head h2 svg { color: var(--text-3); }

.count {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-2);
  font-size: 0.68rem;
  font-weight: 650;
  padding: 1px 7px;
  border-radius: 999px;
  min-width: 20px;
  text-align: center;
}

.toggle {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  user-select: none;
}

.toggle input { position: absolute; opacity: 0; width: 0; height: 0; }

.toggle-ui {
  width: 34px;
  height: 20px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  position: relative;
  transition: background var(--ease);
}

.toggle-ui::after {
  content: "";
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--text-3);
  top: 2px;
  left: 2px;
  transition: transform var(--ease), background var(--ease);
}

.toggle input:checked + .toggle-ui {
  background: var(--accent-dim);
  border-color: var(--text-3);
}

.toggle input:checked + .toggle-ui::after {
  transform: translateX(14px);
  background: var(--text);
}

.toggle-txt {
  font-size: 0.72rem;
  color: var(--text-3);
  font-weight: 550;
}

.inbox-body {
  flex: 1;
  overflow-y: auto;
  max-height: 380px;
  -webkit-overflow-scrolling: touch;
}

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 40px 24px;
  text-align: center;
  color: var(--text-3);
}

.empty svg { margin-bottom: 6px; opacity: 0.5; }
.empty p { color: var(--text-2); font-weight: 550; font-size: 0.92rem; }
.empty span { font-size: 0.8rem; max-width: 220px; line-height: 1.45; }

.msg {
  display: flex;
  gap: 11px;
  padding: 13px 16px;
  border-bottom: 1px solid var(--border-soft);
  cursor: pointer;
  transition: background var(--ease);
  animation: in 0.25s ease;
}

@keyframes in {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}

.msg:hover { background: var(--surface-2); }
.msg:active { background: var(--bg); }

.msg-av {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: var(--accent-dim);
  color: var(--text);
  display: grid;
  place-items: center;
  font-size: 0.78rem;
  font-weight: 650;
  flex-shrink: 0;
  text-transform: uppercase;
}

.msg-body { flex: 1; min-width: 0; }

.msg-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 1px;
}

.msg-from {
  font-weight: 600;
  font-size: 0.88rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.msg-time {
  font-size: 0.7rem;
  color: var(--text-3);
  flex-shrink: 0;
}

.msg-sub {
  font-size: 0.82rem;
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.msg-ex {
  font-size: 0.76rem;
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 1px;
}

.msg.unread .msg-from { color: var(--text); }
.msg.unread .msg-sub { font-weight: 550; color: var(--text); }

/* Sheet */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s ease;
}

.sheet-backdrop[hidden] { display: none; }
.sheet-backdrop.open { opacity: 1; }

.sheet {
  background: var(--surface);
  border: 1px solid var(--border);
  border-bottom: 0;
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 440px;
  max-height: 88dvh;
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
}

.sheet-backdrop.open .sheet { transform: translateY(0); }

@media (min-width: 480px) {
  .sheet-backdrop { align-items: center; padding: 16px; }
  .sheet {
    border-radius: var(--radius);
    border-bottom: 1px solid var(--border);
    max-height: 78vh;
  }
}

.sheet-bar {
  display: flex;
  justify-content: flex-end;
  padding: 10px 12px 0;
}

.sheet-meta {
  padding: 4px 18px 14px;
  border-bottom: 1px solid var(--border);
}

.sheet-from {
  font-size: 0.78rem;
  color: var(--text-3);
  word-break: break-all;
  margin-bottom: 4px;
}

.sheet-subject {
  font-size: 1.05rem;
  font-weight: 650;
  letter-spacing: -0.02em;
  line-height: 1.35;
  margin-bottom: 4px;
}

.sheet-date {
  font-size: 0.72rem;
  color: var(--text-3);
}

.sheet-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px 18px;
  font-size: 0.9rem;
  color: var(--text-2);
  line-height: 1.6;
  -webkit-overflow-scrolling: touch;
}

.sheet-content a { color: var(--text); }
.sheet-content img { max-width: 100%; height: auto; border-radius: 6px; }
.sheet-content pre {
  white-space: pre-wrap;
  word-break: break-word;
  font-family: var(--mono);
  font-size: 0.82rem;
  background: var(--surface-2);
  padding: 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
}

.sheet-foot {
  padding: 12px 18px 18px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
}

.btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  font-family: var(--font);
  font-size: 0.82rem;
  font-weight: 550;
  cursor: pointer;
  color: var(--text-2);
  transition: background var(--ease), color var(--ease);
}

.btn-ghost.danger { color: var(--warn); }
.btn-ghost.danger:hover {
  background: color-mix(in srgb, var(--warn) 10%, transparent);
  border-color: color-mix(in srgb, var(--warn) 35%, transparent);
}

/* Toast */
.toast {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(70px);
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 0.84rem;
  font-weight: 550;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s cubic-bezier(0.32, 0.72, 0, 1);
  white-space: nowrap;
  max-width: 90vw;
  overflow: hidden;
  text-overflow: ellipsis;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.toast.err { border-color: color-mix(in srgb, var(--warn) 45%, transparent); }

.foot {
  text-align: center;
  font-size: 0.7rem;
  color: var(--text-3);
  padding: 4px 8px;
  line-height: 1.5;
}

@media (max-width: 360px) {
  .act { font-size: 0.68rem; padding: 10px 4px; }
  .custom-row { flex-direction: column; }
  .btn-solid { padding: 11px; }
}

@supports (padding: max(0px)) {
  .shell {
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    padding-bottom: max(32px, env(safe-area-inset-bottom));
  }
}

/* Light theme polish */
[data-theme="light"] body {
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(37, 99, 235, 0.07), transparent 55%),
    var(--bg);
}

[data-theme="light"] .panel {
  box-shadow: var(--shadow);
  border-color: #e5e7eb;
}

[data-theme="light"] .address-box.ready {
  background: linear-gradient(180deg, #f8faff 0%, #f5f6f8 100%);
  border-color: #c7d2fe;
}

[data-theme="light"] .address-box code {
  color: #1e3a8a;
}

[data-theme="light"] .btn-solid {
  background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
  color: #fff;
  box-shadow: 0 1px 2px rgba(37, 99, 235, 0.25);
}

[data-theme="light"] .btn-solid:hover {
  opacity: 1;
  filter: brightness(1.05);
}

[data-theme="light"] .live-dot {
  background: #10b981;
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
}

[data-theme="light"] .act:hover:not(:disabled) {
  background: #fff;
  border-color: #cbd5e1;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
}

[data-theme="light"] .msg:hover {
  background: #f8fafc;
}

[data-theme="light"] .msg-av {
  background: #eff6ff;
  color: #2563eb;
}

[data-theme="light"] .count {
  background: #eff6ff;
  border-color: #bfdbfe;
  color: #1d4ed8;
}

[data-theme="light"] .icon-btn {
  background: #fff;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
}

[data-theme="light"] .toggle input:checked + .toggle-ui {
  background: #2563eb;
  border-color: #2563eb;
}

[data-theme="light"] .toggle input:checked + .toggle-ui::after {
  background: #fff;
}

[data-theme="light"] .sheet {
  box-shadow: 0 -8px 40px rgba(15, 23, 42, 0.12);
}

[data-theme="light"] .toast {
  box-shadow: var(--shadow);
  background: #fff;
}

[data-theme="light"] .brand-mark {
  color: #2563eb;
}

[data-theme="light"] .field:focus-within {
  border-color: #93c5fd;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

/* HTML email body */
.sheet-content img {
  max-width: 100% !important;
  height: auto !important;
}
.sheet-content table {
  max-width: 100% !important;
  border-collapse: collapse;
}
.sheet-content td, .sheet-content th {
  max-width: 100%;
  word-break: break-word;
}

</style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <div class="shell">
    <header class="top">
      <div class="brand">
        <svg class="brand-mark" width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect x="2" y="6" width="28" height="20" rx="3" stroke="currentColor" stroke-width="2"/>
          <path d="M2 10l14 9 14-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">TempMail</span>
      </div>
      <button type="button" class="icon-btn" id="btnTheme" aria-label="Ganti tema">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="18" height="18">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="18" height="18">
          <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/>
        </svg>
      </button>
    </header>

    <section class="panel email-panel">
      <div class="panel-label">
        <span class="live-dot"></span>
        Alamat aktif
      </div>

      <div class="address-box" id="emailBox">
        <code id="emailAddress">Menyiapkan…</code>
      </div>

      <div class="action-row">
        <button type="button" class="act" id="btnCopy" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="16" height="16">
            <rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/>
          </svg>
          Salin
        </button>
        <button type="button" class="act" id="btnRefresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="16" height="16">
            <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
          </svg>
          Cek
        </button>
        <button type="button" class="act act-warn" id="btnNew">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="16" height="16">
            <path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v5h5"/>
          </svg>
          Baru
        </button>
      </div>

      <div class="custom-row">
        <div class="field">
          <input type="text" id="customUser" placeholder="username" maxlength="20" autocomplete="off" spellcheck="false" />
          <span class="field-suffix" id="domainHint">@…</span>
        </div>
        <button type="button" class="btn-solid" id="btnCustom">Pakai</button>
      </div>
    </section>

    <section class="panel inbox-panel">
      <div class="inbox-head">
        <h2>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="16" height="16">
            <path d="M4 6h16v12H4z"/><path d="M4 8l8 5 8-5"/>
          </svg>
          Inbox
          <span class="count" id="msgCount">0</span>
        </h2>
        <label class="toggle">
          <input type="checkbox" id="autoRefresh" checked />
          <span class="toggle-ui"></span>
          <span class="toggle-txt">Auto</span>
        </label>
      </div>

      <div class="inbox-body" id="inboxList">
        <div class="empty" id="emptyState">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40">
            <rect x="6" y="12" width="36" height="26" rx="3"/>
            <path d="M6 16l18 12 18-12"/>
          </svg>
          <p>Belum ada pesan</p>
          <span>Kirim email ke alamat di atas, lalu tunggu sebentar</span>
        </div>
      </div>
    </section>

    <footer class="foot">
      <p>Email sementara · pesan disimpan singkat · jangan untuk data penting</p>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-bar">
        <button type="button" class="icon-btn" id="btnCloseSheet" aria-label="Tutup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="18" height="18">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>
      <div class="sheet-meta">
        <div class="sheet-from" id="sheetFrom"></div>
        <h3 class="sheet-subject" id="sheetSubject"></h3>
        <time class="sheet-date" id="sheetDate"></time>
      </div>
      <div class="sheet-content" id="sheetBody"></div>
      <div class="sheet-foot">
        <button type="button" class="btn-ghost danger" id="btnDeleteMsg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="15" height="15">
            <path d="M4 7h16M9 7V5h6v2M8 7v12a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V7"/>
          </svg>
          Hapus
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
const API = 'https://api.guerrillamail.com/ajax.php';
const KEY = 'tm_sess_v2';

const state = {
  sid: null,
  email: null,
  seq: 0,
  messages: [],
  currentId: null,
  auto: true,
  timer: null,
};

const $ = (s) => document.querySelector(s);
const emailEl = $('#emailAddress');
const domainHint = $('#domainHint');
const inboxList = $('#inboxList');
const emptyState = $('#emptyState');
const msgCount = $('#msgCount');
const backdrop = $('#sheetBackdrop');
const toastEl = $('#toast');

function toast(msg, type = '') {
  toastEl.textContent = msg;
  toastEl.className = 'toast show ' + type;
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

function fmtTime(ts) {
  const d = typeof ts === 'number' ? new Date(ts * 1000) : new Date(ts);
  if (isNaN(d)) return '';
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'baru';
  if (diff < 3600) return Math.floor(diff / 60) + ' m';
  if (diff < 86400) return Math.floor(diff / 3600) + ' j';
  return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function initial(name) {
  if (!name) return '?';
  const p = name.trim().split(/[\s<@]+/);
  return (p[0][0] || '?').toUpperCase();
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

async function gm(params) {
  const q = new URLSearchParams(params);
  if (state.sid) q.set('sid_token', state.sid);
  const res = await fetch(`${API}?${q}`, { method: 'GET', credentials: 'omit' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      sid: state.sid,
      email: state.email,
      seq: state.seq,
    }));
  } catch {}
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d.sid || !d.email) return false;
    state.sid = d.sid;
    state.email = d.email;
    state.seq = d.seq || 0;
    return true;
  } catch {
    return false;
  }
}

function setEmailUI(addr) {
  state.email = addr;
  emailEl.textContent = addr;
  $('#emailBox').classList.add('ready');
  $('#btnCopy').disabled = false;
  const domain = addr.includes('@') ? addr.split('@')[1] : '';
  domainHint.textContent = domain ? '@' + domain : '@…';
}

async function createEmail() {
  emailEl.textContent = 'Menyiapkan…';
  $('#emailBox').classList.remove('ready');
  $('#btnCopy').disabled = true;

  try {
    const data = await gm({ f: 'get_email_address', lang: 'en' });
    if (!data.email_addr || !data.sid_token) throw new Error('Respons tidak valid');
    state.sid = data.sid_token;
    state.seq = 0;
    state.messages = [];
    setEmailUI(data.email_addr);
    save();
    renderInbox();
    msgCount.textContent = '0';
    startPoll();
    toast('Email siap', 'ok');
  } catch (e) {
    emailEl.textContent = 'Gagal membuat email';
    toast(e.message || 'Gagal terhubung', 'err');
    console.error(e);
  }
}

async function setCustom(user) {
  if (!state.sid) {
    await createEmail();
  }
  try {
    const data = await gm({
      f: 'set_email_user',
      email_user: user,
      lang: 'en',
    });
    // API returns email_addr or sometimes just confirms
    const addr = data.email_addr || `${user}@${(state.email || '').split('@')[1] || 'guerrillamailblock.com'}`;
    if (data.sid_token) state.sid = data.sid_token;
    state.seq = 0;
    state.messages = [];
    setEmailUI(addr);
    save();
    renderInbox();
    msgCount.textContent = '0';
    startPoll();
    toast('Username dipasang', 'ok');
  } catch (e) {
    toast(e.message || 'Gagal set username', 'err');
    console.error(e);
  }
}

async function restore() {
  if (!load()) return false;
  try {
    // ping session
    const data = await gm({ f: 'get_email_address', lang: 'en' });
    // If we get a different email, session may have rotated — keep ours via set
    if (data.sid_token) state.sid = data.sid_token;
    // Re-assert our address if possible
    if (state.email) {
      const user = state.email.split('@')[0];
      try {
        await gm({ f: 'set_email_user', email_user: user, lang: 'en' });
      } catch {}
    }
    setEmailUI(state.email);
    await checkMail(true);
    startPoll();
    return true;
  } catch {
    localStorage.removeItem(KEY);
    state.sid = null;
    return false;
  }
}

async function checkMail(silent = false) {
  if (!state.sid) return;
  const btn = $('#btnRefresh');
  if (!silent) btn.classList.add('spinning');

  try {
    const data = await gm({ f: 'check_email', seq: state.seq });
    if (data.list && Array.isArray(data.list)) {
      // Guerrilla returns newest first sometimes; merge by mail_id
      const map = new Map(state.messages.map((m) => [String(m.mail_id), m]));
      for (const m of data.list) {
        if (m.mail_id === 0 || m.mail_id === '0') continue; // welcome placeholder
        map.set(String(m.mail_id), m);
      }
      state.messages = Array.from(map.values()).sort(
        (a, b) => Number(b.mail_timestamp || 0) - Number(a.mail_timestamp || 0)
      );
      if (typeof data.seq !== 'undefined') state.seq = data.seq;
      save();
      msgCount.textContent = String(state.messages.length);
      renderInbox();
    }
  } catch (e) {
    if (!silent) toast('Gagal cek inbox', 'err');
    console.error(e);
  } finally {
    btn.classList.remove('spinning');
  }
}

function renderInbox() {
  inboxList.querySelectorAll('.msg').forEach((el) => el.remove());

  if (!state.messages.length) {
    emptyState.style.display = 'flex';
    return;
  }
  emptyState.style.display = 'none';

  for (const m of state.messages) {
    const from = m.mail_from || 'Unknown';
    const el = document.createElement('div');
    el.className = 'msg';
    el.dataset.id = m.mail_id;
    el.innerHTML = `
      <div class="msg-av">${esc(initial(from))}</div>
      <div class="msg-body">
        <div class="msg-row">
          <span class="msg-from">${esc(from)}</span>
          <span class="msg-time">${esc(fmtTime(m.mail_timestamp))}</span>
        </div>
        <div class="msg-sub">${esc(m.mail_subject || '(Tanpa subjek)')}</div>
        <div class="msg-ex">${esc(m.mail_excerpt || '')}</div>
      </div>
    `;
    el.addEventListener('click', () => openMsg(m.mail_id));
    inboxList.appendChild(el);
  }
}

async function openMsg(id) {
  state.currentId = id;
  backdrop.hidden = false;
  requestAnimationFrame(() => backdrop.classList.add('open'));
  $('#sheetFrom').textContent = 'Memuat…';
  $('#sheetSubject').textContent = '';
  $('#sheetDate').textContent = '';
  $('#sheetBody').innerHTML = '<p style="color:var(--text-3)">Memuat pesan…</p>';

  try {
    const data = await gm({ f: 'fetch_email', email_id: id });
    $('#sheetFrom').textContent = data.mail_from || '';
    $('#sheetSubject').textContent = data.mail_subject || '(Tanpa subjek)';
    $('#sheetDate').textContent = fmtTime(data.mail_timestamp);

    let body = data.mail_body || data.mail_excerpt || '(Kosong)';
    body = String(body)
      .replace(/<script[\s\S]*?<\/script>/gi, '')
      .replace(/<iframe[\s\S]*?<\/iframe>/gi, '');
    if (/<[a-z][\s\S]*>/i.test(body)) {
      $('#sheetBody').innerHTML = body;
      // Biar gambar di HTML email bisa load (banyak CDN blok referrer)
      $('#sheetBody').querySelectorAll('img').forEach((img) => {
        img.setAttribute('referrerpolicy', 'no-referrer');
        img.setAttribute('loading', 'lazy');
        img.style.maxWidth = '100%';
        img.style.height = 'auto';
        const src = img.getAttribute('src') || '';
        if (/^https?:\/\//i.test(src)) {
          img.setAttribute('src', '/api/proxy?url=' + encodeURIComponent(src));
        }
        img.addEventListener('error', function onErr() {
          img.removeEventListener('error', onErr);
          if (!img.dataset.fallback) {
            img.dataset.fallback = '1';
            img.style.display = 'none';
            const alt = document.createElement('span');
            alt.style.cssText = 'display:inline-block;padding:4px 8px;background:var(--surface-2);border-radius:6px;font-size:0.8rem;color:var(--text-3)';
            alt.textContent = img.alt || 'gambar';
            img.parentNode && img.parentNode.insertBefore(alt, img.nextSibling);
          }
        });
      });
      });
    } else {
      $('#sheetBody').innerHTML = `<pre>${esc(body)}</pre>`;
    }
  } catch (e) {
    $('#sheetBody').innerHTML = `<p style="color:var(--warn)">Gagal memuat: ${esc(e.message)}</p>`;
  }
}

function closeSheet() {
  backdrop.classList.remove('open');
  setTimeout(() => {
    backdrop.hidden = true;
    state.currentId = null;
  }, 220);
}

async function deleteMsg() {
  if (!state.currentId) return;
  try {
    await gm({ f: 'del_email', email_ids: `[${state.currentId}]` });
    state.messages = state.messages.filter((m) => String(m.mail_id) !== String(state.currentId));
    msgCount.textContent = String(state.messages.length);
    renderInbox();
    closeSheet();
    toast('Pesan dihapus', 'ok');
  } catch (e) {
    // still remove locally if API fails
    state.messages = state.messages.filter((m) => String(m.mail_id) !== String(state.currentId));
    msgCount.textContent = String(state.messages.length);
    renderInbox();
    closeSheet();
    toast('Dihapus dari daftar', 'ok');
  }
}

function startPoll() {
  stopPoll();
  if (!state.auto) return;
  // Cepat saat inbox kosong (nunggu OTP), pelan sedikit kalau sudah ada pesan
  const tick = () => {
    checkMail(true).finally(() => {
      if (!state.auto) return;
      const ms = state.messages.length === 0 ? 2000 : 4000;
      state.timer = setTimeout(tick, ms);
    });
  };
  state.timer = setTimeout(tick, 1500);
}

function stopPoll() {
  if (state.timer) {
    clearTimeout(state.timer);
    clearInterval(state.timer);
    state.timer = null;
  }
}

/* Events */
$('#btnCopy').addEventListener('click', async () => {
  if (!state.email) return;
  try {
    await navigator.clipboard.writeText(state.email);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = state.email;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  const btn = $('#btnCopy');
  btn.classList.add('copied');
  btn.querySelector('span') || (btn.lastChild.textContent = ' Tersalin');
  // keep structure simple
  const label = [...btn.childNodes].find((n) => n.nodeType === 3);
  toast('Disalin', 'ok');
  setTimeout(() => btn.classList.remove('copied'), 1500);
});

$('#btnRefresh').addEventListener('click', () => checkMail(false));

$('#btnNew').addEventListener('click', async () => {
  stopPoll();
  localStorage.removeItem(KEY);
  state.sid = null;
  state.messages = [];
  state.seq = 0;
  await createEmail();
});

$('#btnCustom').addEventListener('click', async () => {
  let user = $('#customUser').value.trim().toLowerCase().replace(/[^a-z0-9._-]/g, '');
  if (user.length < 3) {
    toast('Username min. 3 karakter', 'err');
    return;
  }
  if (user.length > 20) user = user.slice(0, 20);
  const btn = $('#btnCustom');
  btn.disabled = true;
  btn.textContent = '…';
  try {
    await setCustom(user);
    $('#customUser').value = '';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Pakai';
  }
});

$('#customUser').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') $('#btnCustom').click();
});

$('#autoRefresh').addEventListener('change', (e) => {
  state.auto = e.target.checked;
  if (state.auto) startPoll();
  else stopPoll();
});

$('#btnCloseSheet').addEventListener('click', closeSheet);
backdrop.addEventListener('click', (e) => {
  if (e.target === backdrop) closeSheet();
});
$('#btnDeleteMsg').addEventListener('click', deleteMsg);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && backdrop.classList.contains('open')) closeSheet();
});

/* Theme */
const themeBtn = $('#btnTheme');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('tm_theme', t);
}
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
});
const savedTheme = localStorage.getItem('tm_theme');
if (savedTheme) applyTheme(savedTheme);

/* Boot */
(async () => {
  try {
    const ok = await restore();
    if (!ok) await createEmail();
  } catch (e) {
    emailEl.textContent = 'Gagal terhubung';
    toast(e.message || 'Error', 'err');
    console.error(e);
  }
})();

</script>
</body>
</html>
